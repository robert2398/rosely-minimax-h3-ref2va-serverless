[program:h3-comfyui]
command=/opt/rosely-h3-serverless/start_comfyui.sh
priority=10
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
environment=PROC_NAME="h3-comfyui"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:h3-model-server]
command=/opt/rosely-h3-serverless/start_model_server.sh
priority=20
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
environment=PROC_NAME="h3-model-server"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
